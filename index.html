<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Marvel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Каталог Marvel</div>
        <button class="btn" id="btnTheme">Сменить тему</button>
    </header>
    <main>
        <div class="banner">
            <p>Исследуйте киновселенную Marvel с нами</p>
            <img src="img/1.jpg" alt="Баннер">
        </div>

        <div class="section">
            <h1>Галерея</h1>
            <div class="gallery">
                <img class="card" src="img/2.jpg">
                <img class="card" src="img/3.jpg">
                <img class="card" src="img/4.jpg">
            </div>
        </div>
    </main>
    <footer>
        &copy;2026 Каталог Marvel
    </footer>

    <script src="script.js"></script>
</body>
</html>
